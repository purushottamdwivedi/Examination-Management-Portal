{% extends 'base.html' %}{% block title %}Login{% endblock %}{% block body %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body">
<h4>Sign in</h4><form method="post">
<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
<button class="btn btn-primary w-100">Login</button></form>
<p class="mt-3 mb-0 small">New student or examiner? <a href="{{ url_for('auth.register') }}">Register</a></p></div></div></div></div>{% endblock %}
