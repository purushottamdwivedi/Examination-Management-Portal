{% extends 'base.html' %}{% block body %}<div class="row"><div class="col-md-6"><div class="card"><div class="card-body"><h4>Edit profile</h4>
<form method="post"><p class="text-muted small">{{ user.email }}</p>
<div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ user.name }}" required></div>
<div class="mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ user.phone or '' }}"></div>
<div class="mb-3"><label class="form-label">Department</label><input name="department" class="form-control" value="{{ user.department or '' }}"></div>
{% if user.role=='student' %}<div class="mb-3"><label class="form-label">Roll no.</label><input name="student_no" class="form-control" value="{{ user.student_no or '' }}"></div>{% endif %}
<div class="mb-3"><label class="form-label">New password (optional)</label><input type="password" name="password" class="form-control"></div>
<button class="btn btn-primary">Save</button></form></div></div></div></div>{% endblock %}
