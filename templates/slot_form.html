{% extends 'base.html' %}{% block body %}<h3>{{ 'Edit' if s else 'New' }} slot – {{ e.name }}</h3>
<form method="post" class="row g-3 col-md-8">
<div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" min="{{ today }}" class="form-control" value="{{ s.date if s }}" required></div>
<div class="col-md-4"><label class="form-label">Start</label><input type="time" name="start" class="form-control" value="{{ s.start if s }}" required></div>
<div class="col-md-4"><label class="form-label">End</label><input type="time" name="end" class="form-control" value="{{ s.end if s }}" required></div>
<div class="col-md-4"><label class="form-label">Capacity</label><input type="number" min="1" name="capacity" class="form-control" value="{{ s.capacity if s else 1 }}" required></div>
<div class="col-md-8"><label class="form-label">Location / link</label><input name="location" class="form-control" value="{{ s.location or e.venue or '' if s else e.venue or '' }}"></div>
<div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-link" href="{{ url_for('examiner.dashboard') }}">Cancel</a></div></form>{% endblock %}
